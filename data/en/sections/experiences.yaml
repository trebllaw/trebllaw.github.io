- company:
    name: Foundever
    url: "https://www.foundever.com"
    location: Ortigas, Pasig
    # company overview
    overview: "At Foundever, we make things simple. Put simply, our mission is to be the solutions and the team behind the best experiences for the worlds leading brands. Wherever and whenever needed. Of course, we know simple is rarely easy. Thats why we invest in creating innovative and human-centric capabilities, designed to deliver competitive advantage for you in the moments that matter."
  positions:
  - designation: Business Intelligence Program Manager
    start: Aug 2019
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end: Dec 2020
    # give some points about what was your responsibilities at the company.
    responsibilities:
      - Spearheaded the global administration and viability of the SAP Business Objects XI4.2 platform, serving as the primary Subject Matter Expert for international teams, ensuring high-uptime data access for mission-critical operations.
      - Managed tenant-level and capacity-level Power BI settings, created Premium Capacity workspaces, and meticulously governed permissions to ensure secure, efficient, and compliant data access across the organization.
      - Optimized Power BI environment by troubleshooting permission and gateway issues, monitoring capacity usage, and developing usage monitoring dashboards to maximize resource allocation.
      - Drove performance improvements by extracting Power BI asset metadata and optimizing complex reports/dashboards using DAX Studio and Tabular Editor, directly enhancing data governance and analytic speed.
      - Proactively monitored BI system logs (BO Servers, CMC, Tomcat) to preemptively identify and resolve issues, consistently achieving high system uptime and preventing critical downtime.

      

  - designation: COR Monitoring Supervisor
    start: Apr 2011
    end: Jul 2019
    responsibilities:
      - Led and mentored a team of 5 reporting analysts responsible for monitoring critical in-house scheduling software and operational performance metrics.
      - Provided expert second-level technical support, leading primary and secondary troubleshooting of ETLs and reports, ensuring adherence to Service Level Agreements (SLAs).
      - Proposed and implemented system and workflow enhancements to the in-house scheduler software, resulting in measurable improvements to team and operational efficiency.

      
  - designation: COR Monitoring Analyst
    start: Jan 2009
    end: Mar 2011
    responsibilities:
      - Proactively monitors in-house scheduler software, resolving issues promptly to minimize operational disruptions.
      - Conducts initial troubleshooting, escalating complex issues to the appropriate teams or personnel.
      - Diligently documents verified solutions in the knowledge management system to enhance team efficiency and knowledge sharing.
      - Meticulously reviews contractual obligations and deliverables to ensure accuracy and client satisfaction.

